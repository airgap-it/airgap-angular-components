name: Build

on:
  push:
  workflow_dispatch:

# Least privilege: every job only reads the repository. Jobs that need more must ask for it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Dockerfile (node:20).
  NODE_VERSION: '20'

jobs:
  build:
    name: 🏗️ Build, Test & Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: ⬇️ Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --ignore-scripts: no dependency lifecycle script runs. Karma needs the Chromium that
      # puppeteer's own install script downloads, so that one is run explicitly.
      - name: 🔧 Install dependencies
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund --ignore-scripts
          node node_modules/puppeteer/install.js

      # Same order as the Dockerfile and the GitLab unit job: ngrx builds against the built core.
      - name: 🏗️ Build
        run: npm run build:prod

      - name: 🧪 Test
        run: npm run test:ci

      - name: 🧹 Lint
        run: npm run lint:ci

      - name: 📦 Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: packages/*/*lintReport.json
          if-no-files-found: ignore
          retention-days: 14

      - name: 📦 Upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: packages/*/dist
          if-no-files-found: error
          retention-days: 7
